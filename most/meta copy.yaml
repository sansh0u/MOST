package:
  name: toolkit
  version: "0.1.0"

source:
  url: https://github.com/sansh0u/toolkit/archive/refs/tags/v0.1.0.tar.gz
  fn: toolkit-0.1.0.tar.gz

build:
  script: | 
    {{ PYTHON }} -m pip install . --no-deps -vv #在测试时加-vv

requirements:
  build:
    - python >=3.10
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - pip
  host:
    - python >=3.10
    - pip
  run:
    - python >=3.10
    - biopython >=1.86
    - pyyaml >=6.0.3
    - chromap >=0.3.2
    - openjdk >=11
    - pigz >=2.6
    - htslib >=1.13
    - cutadapt >=3.5
    - numpy >=1.24.2
    - bbduk >=39.81
    - stpipeline >=2.1.0
    - star >=2.7.11b
    - samtools >=1.23.1
    - snapatac2 >=2.9.0
    - opencv
about:
  home: https://github.com/sansh0u/toolkit
  summary: "My bioinformatics tool"
  license: GPL-3.0
  license_file: LICENSE