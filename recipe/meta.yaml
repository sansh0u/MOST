package:
  name: most
  version: "0.1.0"

source:
  path: ..

build:
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed"

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - python >=3.10,<3.11
    - pip

  host:
    - python >=3.10,<3.11
    - pip
    - setuptools

  run:
    - python >=3.10,<3.11
    - biopython >=1.86
    - bbmap >=39.81
    - beautifulsoup4
    - chromap >=0.3.2
    - numpy >=2.2
    - pandas >=2.3
    - scipy >=1.15
    - matplotlib >=3.10
    - scikit-learn >=1.7
    - pysam >=0.22,<0.23
    - pyarrow >=23
    - pyyaml >=6.0.3
    - samtools >=1.23
    - star >=2.7
    - anndata >=0.11
    - h5py >=3.16
    - openjdk >=11
    - opencv
    - tqdm
    - typer
    - pydantic >=2.13.2
test:
  imports:
    - most

  commands:
    - most --help

about:
  home: https://github.com/sansh0u/MOST
  summary: "Multi-omics Spatial Toolkit"
  license: GPL-3.0