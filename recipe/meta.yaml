package:
  name: spatial_tool
  version: "0.1.0"

source:
  path: ..

build:
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - python >=3.10
    - pip

  host:
    - python >=3.10
    - pip
    - setuptools

  run:
    - python >=3.10
    - biopython >=1.86
    - bbmap >=39.81
    - beautifulsoup4
    - chromap >=0.3.2
    - numpy >=2.2
    - pandas >=2.3
    - scipy >=1.15
    - matplotlib >=3.10
    - scikit-learn >=1.7
    - pysam >=0.20
    - pyarrow >=23
    - pyyaml >=6.0.3
    - samtools >=1.23
    - star >=2.7
    - anndata >=0.11
    - h5py >=3.16
    - openjdk >=11
    - opencv
    - tqdm
    - typer

test:
  imports:
    - spatial_tool

  commands:
    - spatial_tool --help

about:
  home: https://github.com/sansh0u/spatial_tool
  summary: "Spatial transcriptomics analysis toolkit"
  license: GPL-3.0